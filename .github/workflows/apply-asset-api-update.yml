name: Apply asset API update

on:
  push:
    branches: [agent/asset-api-timeline-v2]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: agent/asset-api-timeline-v2

      - name: Apply packaged update
        run: |
          cat .payload/chunk-* | base64 -d | tar -xz
          rm -rf .payload
          rm -f .github/workflows/apply-asset-api-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add remote asset API and flexible timeline model"
          git push origin HEAD:agent/asset-api-timeline-v2
